name: 构建安卓 APK

# 推送到 main/master 或在 Actions 页面手动触发时运行
on:
  push:
    branches: [ main, master, APK ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-22.04
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev build-essential ccache libltdl-dev

      - name: 安装 Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer Cython==0.29.36

      - name: 缓存 Buildozer 全局目录
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}

      - name: 预下载 Android SDK 并接受全部许可证
        # buildozer 的 accept_sdk_license 不一定能接受所有许可证（SDK/build-tools 等多个），
        # 这里先让它把 SDK 拉下来，再用 sdkmanager --licenses 显式全部接受，避免卡在许可证。
        run: |
          yes | buildozer android debug || echo "首次运行到此为止（多半停在许可证），下面显式接受许可证后再正式构建"
          SDK_DIR="$HOME/.buildozer/android/platform/android-sdk"
          SDKMANAGER=$(find "$SDK_DIR" -name sdkmanager -type f 2>/dev/null | head -1)
          if [ -n "$SDKMANAGER" ]; then
            echo "找到 sdkmanager: $SDKMANAGER，接受所有许可证…"
            yes | "$SDKMANAGER" --sdk_root="$SDK_DIR" --licenses || true
          else
            echo "未找到 sdkmanager（SDK 可能尚未下载），继续尝试构建"
          fi

      - name: 构建 Debug APK
        run: |
          yes | buildozer android debug

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: studyapp-debug-apk
          path: bin/*.apk
          if-no-files-found: error
