name: 构建安卓 APK

# 推送到 main/master/APK 或在 Actions 页面手动触发时运行
on:
  push:
    branches: [ main, master, APK ]
  workflow_dispatch:

# 发布 Release 需要写权限
permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 调整权限（容器内 buildozer 以 uid 1000 运行）
        run: sudo chown -R 1000:1000 "$GITHUB_WORKSPACE"

      - name: 用官方 kivy/buildozer 容器构建 APK
        # 官方镜像自带验证过的 SDK/NDK/Java/p4a 工具链。
        # 两段式：先拉 SDK（允许停在许可证）→ 显式接受全部许可证 → 正式构建，
        # 彻底规避“卡在 Android SDK License”导致的失败。
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE":/home/user/hostcwd \
            --entrypoint /bin/bash \
            kivy/buildozer:latest -c '
              set -e
              echo "===== 第一遍：准备 Android SDK（允许停在许可证）====="
              yes | buildozer android debug || echo "首遍到此为止，下面接受许可证后重试"
              for SDK_DIR in "$HOME/.buildozer/android/platform/android-sdk" \
                             "$ANDROID_SDK_ROOT" "$ANDROID_HOME"; do
                [ -d "$SDK_DIR" ] || continue
                SM=$(find "$SDK_DIR" -name sdkmanager -type f 2>/dev/null | head -1)
                if [ -n "$SM" ]; then
                  echo "接受全部 SDK 许可证: $SM"
                  yes | "$SM" --sdk_root="$SDK_DIR" --licenses || true
                fi
              done
              echo "===== 第二遍：正式构建 ====="
              yes | buildozer android debug
            '

      - name: 还原权限
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"

      - name: 列出产物
        run: ls -la bin/ || true

      - name: 上传 APK (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: studyapp-debug-apk
          path: bin/*.apk
          if-no-files-found: error

      - name: 发布到 Release（可匿名直接下载）
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: 学习小管家 · 最新 APK
          body: 每次构建自动更新；直接下载下方的 .apk 安装到安卓手机即可。
          files: bin/*.apk
          fail_on_unmatched_files: true
